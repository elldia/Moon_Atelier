<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moon Atelier — a personal ebook reader.">

  <!--
    Without this, iOS Safari/Chrome (both WebKit) assume a desktop-width
    viewport and fall back to the legacy ~300ms tap-delay / double-tap-to-
    zoom gesture detection on every touch. That delay pushes even a
    same-frame Dart callback outside the window WebKit requires to treat a
    tap as "real" user activation for opening a native file chooser — the
    file picker silently no-ops and the caller hangs forever waiting on it.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moon Atelier">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moon Atelier</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <!--
    Dropbox Chooser (https://www.dropbox.com/developers/chooser) — a
    client-side-only file picker widget, no backend needed. Requires a free
    app key from https://www.dropbox.com/developers/apps (create an app,
    "Chooser/Saver/Embedder" permission type). Replace the placeholder below
    with your real key, or the "Dropbox" library simply won't be defined and
    the app's Dropbox import option will show a "not configured" message.
  -->
  <script id="dropboxjs" src="https://www.dropbox.com/static/api/2/dropins.js" data-app-key="xx0z63zqfvlf1cb"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
